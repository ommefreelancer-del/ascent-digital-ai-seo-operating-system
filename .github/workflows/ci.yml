name: CI

# No CI existed before this workflow -- every regression test added to this
# repo (Boss Agent routing matrix, Google Search Console OAuth, specialist
# pipelines) ran only when someone remembered to run `npm test` locally.
# This is what makes "the application must fail CI if a regression returns"
# (see RUN_GUIDE.md and the routing-matrix.integration.test.ts history)
# actually true instead of aspirational.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  web:
    name: Web app (build, typecheck, test)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Test
        working-directory: web
        run: npm test
      - name: Validate startup
        working-directory: web
        env:
          DATABASE_URL: "file:./prisma/dev.db"
          NEXTAUTH_SECRET: "ci-only-secret-not-used-in-production-00000000"
          NEXTAUTH_URL: "http://localhost:3000"
          ANTHROPIC_API_KEY: "ci-placeholder-key-not-called"
        run: |
          # scripts/validate-startup.mjs deliberately reads web/.env directly
          # off disk rather than process.env (it runs before Next.js's own
          # env loading, which is the thing it's validating) -- so the step
          # env above alone never reaches it. Write the same CI-only, never-
          # real values to .env here so both prisma and the validator see them.
          cat > .env <<EOF
          DATABASE_URL=$DATABASE_URL
          NEXTAUTH_SECRET=$NEXTAUTH_SECRET
          NEXTAUTH_URL=$NEXTAUTH_URL
          ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY
          EOF
          npx prisma db push
          node scripts/validate-startup.mjs
